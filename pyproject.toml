[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "techpulse-terminal"
version = "0.1.0"
description = "Local-first, evidence-aware financial research desktop terminal"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "PySide6>=6.8,<7",
  "pyqtgraph>=0.13.7,<0.15",
  "numpy>=2.1,<3",
  "httpx>=0.28,<0.29",
  "reportlab>=4.2,<5",
]

[project.scripts]
techpulse = "techpulse.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.11,<1", "mypy>=1.15,<2", "pyinstaller>=6.12,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/techpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

